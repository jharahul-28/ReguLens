name: ReguLens Dev CI Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ==========================================
  # JOB 1: Build, Test, JaCoCo & SonarCloud
  # ==========================================
  build-test-and-sonar:
    name: Build, Test & SonarCloud Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          # Shallow clones disabled for proper SonarCloud blame and new code analysis
          fetch-depth: 0

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x ./mvnw

      - name: Compile, Test & Generate JaCoCo Coverage Report
        run: ./mvnw -B clean verify

      - name: Upload JaCoCo Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7

      - name: SonarCloud Code Quality & Coverage Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=jharahul-28_ReguLens \
            -Dsonar.organization=jharahul-28 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  # ==========================================
  # JOB 2: GitHub CodeQL SAST Security Scan
  # ==========================================
  security-scan:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    needs: [build-test-and-sonar]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Autobuild / Compile for CodeQL Analysis
        run: ./mvnw -B compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
