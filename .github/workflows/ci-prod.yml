name: ReguLens Production CI/CD Pipeline

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ==========================================
  # JOB 1: Build, Test, JaCoCo & SonarCloud
  # ==========================================
  build-and-validate:
    name: Production Build & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x ./mvnw

      - name: Compile, Test, JaCoCo & SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=jharahul-28_ReguLens \
            -Dsonar.organization=jharahul-28 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Upload JaCoCo Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

  # ==========================================
  # JOB 2: CodeQL Security Gate
  # ==========================================
  security-gate:
    name: CodeQL Security Gate
    runs-on: ubuntu-latest
    needs: [build-and-validate]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Compile for CodeQL Analysis
        run: ./mvnw -B compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"

  # ==========================================
  # JOB 3: Continuous Deployment to Render Prod
  # ==========================================
  deploy-to-render:
    name: Deploy to Render Production
    runs-on: ubuntu-latest
    needs: [build-and-validate, security-gate]
    # Only deploy when pushing directly or merging into prod (never on Pull Requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'

    steps:
      - name: Trigger Render Production Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning ::RENDER_DEPLOY_HOOK_PROD is not configured in GitHub Secrets yet. Skipping deploy step."
            exit 0
          fi
          echo "Triggering automated deployment to Render Production..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
          echo "Render deployment response HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Successfully triggered Render deployment!"
          else
            echo "Failed to trigger Render deployment. HTTP code: $HTTP_STATUS"
            exit 1
          fi
