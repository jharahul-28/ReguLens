spring.application.name=ReguLens
server.servlet.context-path=/api/v1

# Neon PostgreSQL Datasource Configuration
spring.datasource.url=${NEON_DB_URL:jdbc:postgresql://localhost:5432/ReguLens}
spring.datasource.username=${NEON_DB_USER:postgres}
spring.datasource.password=${NEON_DB_PASSWORD:qwerty12345}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Flyway Migrations
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate (Flyway manages the schema)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# AI / LangChain4j Configuration
regulens.ai.embedding.provider=${EMBEDDING_PROVIDER:gemini}
regulens.ai.embedding.dimension=768
regulens.ai.embedding.api-key=${GEMINI_API_KEY:${OPENAI_API_KEY:test-key}}
regulens.ai.llm.provider=${LLM_PROVIDER:gemini}
regulens.ai.llm.model-name=${LLM_MODEL_NAME:llama-3.3-70b-versatile}
regulens.ai.llm.api-key=${GROQ_API_KEY:${GEMINI_API_KEY:${OPENAI_API_KEY:test-key}}}
regulens.ai.llm.temperature=0.0
regulens.ai.retrieval.similarity-threshold=0.70