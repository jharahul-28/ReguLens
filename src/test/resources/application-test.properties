spring.application.name=ReguLens-Test
server.servlet.context-path=/api/v1

# Test DB configuration
spring.datasource.url=jdbc:postgresql://${NEON_TEST_HOST:localhost}:5432/${NEON_TEST_DB:ReguLensTest}
spring.datasource.username=${NEON_TEST_USER:postgres}
spring.datasource.password=${NEON_TEST_PASSWORD:qwerty12345}
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none

# Test AI properties
regulens.ai.embedding.provider=mock
regulens.ai.embedding.dimension=768
regulens.ai.embedding.api-key=test-key
regulens.ai.llm.model-name=mock
regulens.ai.llm.api-key=test-key
regulens.ai.llm.temperature=0.0
regulens.ai.retrieval.similarity-threshold=0.70
